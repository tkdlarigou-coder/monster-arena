name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install Dependencies
        run: npm install
      - name: Build Android
        run: npx expo export
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monster-arena-app
          path: dist/
